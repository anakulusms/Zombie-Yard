<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Light Yard — Zombie Wave Shooter</title>
<style>
:root{--bg:#e9e4d8;--ink:#2a2620;--muted:#6b6459;--accent:#b8431f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191b;--ink:#e6e1d3;--muted:#8d968f;--accent:#e8794a}}
:root[data-theme="dark"]{--bg:#15191b;--ink:#e6e1d3;--muted:#8d968f;--accent:#e8794a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font:700 clamp(1.6rem,4vw,2.4rem)/1.1 "Courier New",Courier,monospace;margin:0 0 4px;letter-spacing:-.02em}
p.sub{margin:0 0 14px;color:var(--muted);max-width:60ch;text-align:center}
.wrap{width:100%;max-width:960px}
canvas{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:6px;cursor:crosshair;touch-action:none;background:#111}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:12px;color:var(--muted);font-size:.9rem}
kbd{border:1.5px solid var(--muted);border-radius:4px;padding:0 6px;font-family:"Courier New",monospace;color:var(--ink)}
</style>
</head>
<body>
<h1>Last Light Yard</h1>
<p class="sub">Night on a dead colony world. Your helmet lamp and plasma rifle are all that stand between you and the horde. Grab the drops.</p>
<div class="wrap"><canvas id="c" width="960" height="600" tabindex="0" aria-label="Zombie shooter game"></canvas></div>
<div class="keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span><span>Mouse aim</span><span>Hold click to shoot</span><span><kbd>1</kbd><kbd>2</kbd> weapons</span><span><kbd>3</kbd> grenade</span><span><kbd>R</kbd> reload</span><span><kbd>P</kbd> pause</span><span><kbd>M</kbd> mute</span></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=960,H=600;
let best=0;try{best=+localStorage.getItem('lly-best')||0}catch(e){}
const keys={},m={x:W/2,y:H/2,down:false};
let st='menu',P,Z,B,F,U,A,G,E,wave,score,toSpawn,spawnT,banner,shake,paused=false,last=0,kills,nuke=0,msg={t:0,s:''};
const rnd=(a,b)=>a+Math.random()*(b-a);
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const ground=mk(),decal=mk(),lc=mk(),dg=decal.getContext('2d'),lx=lc.getContext('2d');
(function(){
  const x=ground.getContext('2d'),R=rnd;
  const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#4d535b');gr.addColorStop(1,'#393d44');x.fillStyle=gr;x.fillRect(0,0,W,H);
  for(let i=0;i<14000;i++){const v=R(60,115)|0;x.fillStyle='rgba('+v+','+(v+4)+','+(v+10)+','+R(.04,.2)+')';x.fillRect(R(0,W),R(0,H),R(6,22),1)}
  const pw=120,ph=100;
  for(let px=0;px<W;px+=pw)for(let py=0;py<H;py+=ph){
    const sh=R(-8,8);x.fillStyle=(sh>0?'rgba(255,255,255,':'rgba(0,0,0,')+Math.abs(sh)/100+')';x.fillRect(px,py,pw,ph);
    x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=2;x.strokeRect(px+1,py+1,pw-2,ph-2);
    x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=1;x.strokeRect(px+3,py+3,pw-6,ph-6);
    for(const[bx,by]of[[10,10],[pw-10,10],[10,ph-10],[pw-10,ph-10]]){
      x.fillStyle='#22262b';x.beginPath();x.arc(px+bx,py+by,3,0,6.28);x.fill();
      x.fillStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(px+bx-1,py+by-1,1.2,0,6.28);x.fill()}
  }
  const blob=(cx,cy,r,col)=>{const q=x.createRadialGradient(cx,cy,0,cx,cy,r);q.addColorStop(0,col);q.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=q;x.fillRect(cx-r,cy-r,r*2,r*2)};
  function stripes(x0,y0,w,h){
    x.save();x.beginPath();x.rect(x0,y0,w,h);x.clip();
    x.fillStyle='#cfa022';x.fillRect(x0,y0,w,h);x.strokeStyle='#17181a';x.lineWidth=14;
    for(let i=-h;i<w+h;i+=28){x.beginPath();x.moveTo(x0+i,y0+h);x.lineTo(x0+i+h,y0);x.stroke()}
    x.restore();
  }
  stripes(12,12,W-24,18);stripes(12,H-30,W-24,18);stripes(12,30,18,H-60);stripes(W-30,30,18,H-60);
  for(let i=0;i<260;i++){x.fillStyle='rgba(62,66,72,'+R(.4,.8)+')';const e=R(0,4)|0,t=R(0,1);
    const[cx,cy]=e==0?[12+t*(W-24),R(12,30)]:e==1?[12+t*(W-24),R(H-30,H-12)]:e==2?[R(12,30),30+t*(H-60)]:[R(W-30,W-12),30+t*(H-60)];
    x.fillRect(cx,cy,R(1,5),R(1,4))}
  x.save();x.translate(W/2,H/2);
  x.strokeStyle='rgba(225,225,215,.5)';x.lineWidth=10;x.beginPath();x.arc(0,0,200,0,6.28);x.stroke();
  x.lineWidth=4;x.beginPath();x.arc(0,0,176,0,6.28);x.stroke();
  x.fillStyle='rgba(225,225,215,.45)';
  for(let i=0;i<12;i++){x.save();x.rotate(i*Math.PI/6);x.fillRect(-4,-222,8,18);x.restore()}
  
  x.restore();
  x.strokeStyle='rgba(207,160,34,.45)';x.lineWidth=5;x.setLineDash([24,16]);
  x.beginPath();x.moveTo(40,H/2);x.lineTo(W/2-235,H/2);x.moveTo(W/2+235,H/2);x.lineTo(W-40,H/2);x.stroke();x.setLineDash([]);
  for(let i=0;i<10;i++)blob(R(60,W-60),R(60,H-60),R(40,95),'rgba(8,6,5,.5)');
  for(let i=0;i<8;i++)blob(R(0,W),R(0,H),R(20,50),'rgba(34,24,10,.5)');
  for(let i=0;i<3;i++){
    const cx=R(130,W-130),cy=R(110,H-110),r=R(28,46);
    blob(cx,cy,r*1.5,'rgba(5,4,3,.85)');x.strokeStyle='rgba(135,140,148,.5)';x.lineWidth=3;x.beginPath();x.arc(cx,cy,r,0,6.28);x.stroke();
    x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=1.5;
    for(let k=0;k<7;k++){const a=R(0,6.28);let px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.beginPath();x.moveTo(px,py);for(let j=0;j<5;j++){px+=Math.cos(a+R(-.4,.4))*R(8,16);py+=Math.sin(a+R(-.4,.4))*R(8,16);x.lineTo(px,py)}x.stroke()}
  }
  x.lineCap='round';
  for(let i=0;i<4;i++){const cx=R(0,W),cy=R(0,H);x.strokeStyle='#14161a';x.lineWidth=4;x.beginPath();x.moveTo(cx,cy);x.bezierCurveTo(cx+R(-120,120),cy+R(-80,80),cx+R(-120,120),cy+R(-80,80),cx+R(-160,160),cy+R(-100,100));x.stroke();x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=1;x.stroke()}
  for(let i=0;i<16;i++){const a=i/16*6.28,lx=W/2+Math.cos(a)*238,ly=H/2+Math.sin(a)*238;
    blob(lx,ly,20,'rgba(255,170,40,.3)');x.fillStyle='#1a1c1f';x.beginPath();x.arc(lx,ly,5,0,6.28);x.fill();x.fillStyle=i%4==0?'#ff5a3c':'#ffb347';x.beginPath();x.arc(lx,ly,3,0,6.28);x.fill()}
  function frag(cx,cy,sz,rot,label){
    x.save();x.translate(cx,cy);x.rotate(rot);
    const n=6+(R(0,3)|0),pts=[];for(let i=0;i<n;i++){const a=i/n*6.28,rr=sz*R(.6,1.1);pts.push([Math.cos(a)*rr*1.3,Math.sin(a)*rr*.8])}
    const path=(o)=>{x.beginPath();pts.forEach((p,i)=>x[i?'lineTo':'moveTo'](p[0]+o,p[1]+o));x.closePath()};
    x.fillStyle='rgba(0,0,0,.45)';path(8);x.fill();
    const q=x.createLinearGradient(-sz,-sz,sz,sz);q.addColorStop(0,'#8c929b');q.addColorStop(.5,'#585e66');q.addColorStop(1,'#2a2d32');
    x.fillStyle=q;path(0);x.fill();x.strokeStyle='#15171a';x.lineWidth=2;x.stroke();
    x.save();path(0);x.clip();
    x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=2;for(let i=-3;i<=3;i++){x.beginPath();x.moveTo(i*sz*.3,-sz);x.lineTo(i*sz*.3,sz);x.stroke()}
    const sc=x.createRadialGradient(sz*.3,sz*.2,0,sz*.3,sz*.2,sz);sc.addColorStop(0,'rgba(0,0,0,.6)');sc.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=sc;x.fillRect(-sz*2,-sz*2,sz*4,sz*4);
    if(label){x.font='900 '+(sz*.38|0)+'px "Courier New",monospace';x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(235,235,225,.5)';x.fillText(label,0,0)}
    x.restore();
    x.strokeStyle='rgba(255,255,255,.2)';x.lineWidth=1;path(-1);x.stroke();
    x.restore();
  }
  frag(95,505,48,.4);frag(868,98,72,-.5,'ARK-7');frag(842,522,34,1.2);frag(122,128,30,2.2);frag(500,556,24,.1);frag(300,44,22,.8);frag(790,300,20,1.9);frag(180,330,18,.6);
  for(let i=0;i<500;i++){x.strokeStyle='rgba(200,205,212,'+R(.04,.14)+')';x.lineWidth=1;const sx=R(0,W),sy=R(0,H);x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+R(-14,14),sy+R(-6,6));x.stroke()}
})();

let AC=null,master=null,muted=false,nb=null,grT=3,dieT=0,hitT=0;
function initAudio(){
  if(AC){if(AC.state=='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
  nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const o=AC.createOscillator(),o2=AC.createOscillator(),gn=AC.createGain(),lf=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=41;o2.type='sine';o2.frequency.value=62;gn.gain.value=.035;
  lf.frequency.value=.15;lg.gain.value=.015;lf.connect(lg);lg.connect(gn.gain);
  f.type='lowpass';f.frequency.value=160;o.connect(f);o2.connect(f);f.connect(gn);gn.connect(master);o.start();o2.start();lf.start();
}
function tone(type,f0,f1,dur,vol,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(v);v.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,f0,f1,type,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0),sr=AC.createBufferSource(),fl=AC.createBiquadFilter(),v=AC.createGain();
  sr.buffer=nb;fl.type=type||'lowpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  sr.connect(fl);fl.connect(v);v.connect(master);sr.start(t,Math.random()*.5);sr.stop(t+dur+.02);
}
const SFX={
  clear(){[330,415,495,660].forEach((f,i)=>tone('triangle',f,f*1.01,.22,.14,i*.09));noise(.5,.08,1800,400,'bandpass',.1)},
  shotgun(){noise(.28,.55,4500,200);tone('sawtooth',220,40,.25,.3);tone('square',180,90,.06,.1,.38)},
  throwg(){tone('triangle',300,520,.12,.12)},
  laser(){tone('sawtooth',1400,180,.14,.09);tone('square',700,90,.1,.05)},
  spread(){tone('sawtooth',900,90,.22,.12);noise(.15,.1,3000,300)},
  hit(){const n=performance.now();if(n-hitT<35)return;hitT=n;noise(.08,.16,1500,300)},
  die(){const n=performance.now();if(n-dieT<50)return;dieT=n;tone('sine',160,40,.25,.2);noise(.3,.18,900,100)},
  hurt(){tone('sine',110,45,.25,.35);noise(.2,.2,600,100)},
  recharge(){tone('square',300,600,.08,.06);tone('square',500,900,.1,.06,.9)},
  pick(){[520,660,880].forEach((f,i)=>tone('triangle',f,f*1.02,.12,.15,i*.07))},
  nuke(){noise(1.4,.5,5000,50);tone('sawtooth',200,25,1.2,.35)},
  wave(){tone('sawtooth',110,95,.9,.14);tone('sawtooth',165,140,.9,.1)},
  spit(){tone('sine',300,900,.18,.12);noise(.12,.1,2500,800,'bandpass')},
  splash(){noise(.15,.15,2000,400,'bandpass')},
  boom(){noise(.8,.5,2500,60);tone('sine',90,25,.6,.4)},
  over(){[300,240,180,110].forEach((f,i)=>tone('sawtooth',f,f*.9,.5,.16,i*.28))},
  groan(){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),fl=AC.createBiquadFilter(),v=AC.createGain(),f=rnd(70,110);
    o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.6,t+.9);fl.type='lowpass';fl.frequency.value=350;
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.09,t+.2);v.gain.linearRampToValueAtTime(0,t+.9);
    o.connect(fl);fl.connect(v);v.connect(master);o.start(t);o.stop(t+1)}
};
function damage(d){
  if(P.fx.shield>0||st!='play')return;
  P.hp-=d;P.hit=.6;shake=8;SFX.hurt();blood(P.x,P.y,8,'#8a1c1c');splat(P.x,P.y,5,14,.8);
  if(P.hp<=0){P.hp=0;st='over';SFX.over();if(score>best){best=score;try{localStorage.setItem('lly-best',best)}catch(e){}}}
}
function explode(x,y,src){
  SFX.boom();shake=Math.max(shake,12);blood(x,y,30,'#b8d42a');splat(x,y,24,70,1);
  dg.fillStyle='rgba(120,160,20,.3)';dg.beginPath();dg.arc(x,y,60,0,6.28);dg.fill();
  if(Math.hypot(P.x-x,P.y-y)<95)damage(25);
  for(const z of Z)if(z!==src&&!z.dead&&Math.hypot(z.x-x,z.y-y)<95){z.hp-=3;if(z.hp<=0)kill(z)}
}
let introT=0, introDone=false;
const INTRO=10.2;let padF=0,clr=0,clrOn=false;

function shootSG(){
  if(P.cd>0||P.rel>0)return;
  if(P.sa<=0){P.rel=1.6;SFX.recharge();return}
  const mx=P.x+Math.cos(P.a)*40,my=P.y+Math.sin(P.a)*40,np=P.fx.spread>0?14:9;
  for(let i=0;i<np;i++){const a=P.a+rnd(-.3,.3),sp=rnd(650,900);B.push({x:mx,y:my,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:rnd(.28,.42),p:0,h:[],c:'255,150,40'})}
  P.sa--;P.cd=P.fx.rapid>0?.4:.8;P.flash=.07;shake=Math.max(shake,7);SFX.shotgun();
  if(P.sa<=0){P.rel=1.6;SFX.recharge()}
}
function throwG(){
  if(P.gc>0)return;
  const d=Math.min(Math.hypot(m.x-P.x,m.y-P.y),420);
  G.push({x:P.x,y:P.y,sx:P.x,sy:P.y,tx:P.x+Math.cos(P.a)*d,ty:P.y+Math.sin(P.a)*d,t:0,dur:Math.max(.45,d/520),z:0});
  P.gc=10;SFX.throwg();
}
function gExplode(x,y){
  SFX.boom();shake=Math.max(shake,14);E.push({x,y,l:.5,max:.5,r1:130,col:'255,160,40'});
  const q=dg.createRadialGradient(x,y,0,x,y,70);q.addColorStop(0,'rgba(10,6,4,.8)');q.addColorStop(1,'rgba(10,6,4,0)');dg.fillStyle=q;dg.fillRect(x-70,y-70,140,140);
  for(let i=0;i<30;i++){const a=rnd(0,6.28),sp=rnd(80,320);F.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:rnd(.3,.7),c:'#ffb040',s:rnd(2,5)})}
  for(const z of Z.slice()){if(z.dead)continue;const d=Math.hypot(z.x-x,z.y-y);if(d<130+z.r*.3){z.hp-=z.t=='boss'?40:d<65?12:7;blood(z.x,z.y,6,'#6a1212');if(z.hp<=0)kill(z)}}
  if(Math.hypot(P.x-x,P.y-y)<75)damage(20);
}
function spawnBoss(){
  const lvl=wave/10|0,hp=150*lvl;
  Z.push({x:W/2,y:-90,t:'boss',a:1.57,sp:60,hp,max:hp,r:46,dmg:30,pts:1000*lvl,ph:0,shirt:'#4b5d3a',skin:'#6a7a52',wx:0,wy:0,state:'enter',tt:0,tc:5,ta:4,ts:7,tl:6,phase:1,lvl,cdir:0});
}
function bossAI(z,dt,a,dd){
  const q=z.hp/z.max;z.phase=q>.66?1:q>.33?2:3;
  if(z.state=='enter'){z.y+=110*dt;if(z.y>100)z.state='walk';return}
  z.tt-=dt;
  if(z.state=='walk'){
    const sp=55+z.phase*14+z.lvl*4;z.x+=Math.cos(a)*sp*dt;z.y+=Math.sin(a)*sp*dt;
    z.tc-=dt;z.ta-=dt;z.ts-=dt;z.tl-=dt;
    if(z.tc<=0&&dd>150){z.state='tele';z.tt=.95;z.cdir=a;tone('sawtooth',90,200,.9,.2)}
    else if(z.phase>=2&&z.ta<=0){z.ta=rnd(4.5,6.5);for(let i=0;i<12;i++){const b=i*Math.PI/6+z.ph;A.push({x:z.x,y:z.y,vx:Math.cos(b)*210,vy:Math.sin(b)*210,l:3.5})}SFX.spit()}
    else if(z.phase>=2&&z.ts<=0){z.ts=rnd(8,11);for(let i=0;i<3;i++)spawn({x:z.x+rnd(-50,50),y:z.y+rnd(-50,50)});SFX.groan()}
    else if(z.phase==3&&z.tl<=0&&dd<280){z.state='slamtele';z.tt=.9;tone('sine',60,30,.9,.3)}
  }else if(z.state=='tele'){
    if(z.tt>.35)z.cdir=a;z.a=z.cdir;
    if(z.tt<=0){z.state='charge';z.tt=.75;tone('sawtooth',300,60,.4,.25)}
  }else if(z.state=='charge'){
    z.a=z.cdir;z.x+=Math.cos(z.cdir)*480*dt;z.y+=Math.sin(z.cdir)*480*dt;
    if(z.tt<=0){z.state='walk';z.tc=rnd(5,7)-z.phase*.5}
  }else if(z.state=='slamtele'){
    if(z.tt<=0){E.push({x:z.x,y:z.y,l:.6,max:.6,r1:200,col:'255,90,50'});shake=Math.max(shake,15);SFX.boom();if(Math.hypot(P.x-z.x,P.y-z.y)<200)damage(30);z.state='walk';z.tl=rnd(5,7)}
  }
  z.x=Math.max(50,Math.min(W-50,z.x));z.y=Math.max(70,Math.min(H-50,z.y));
  if(z.state=='charge'&&(z.x<=50||z.x>=W-50||z.y<=70||z.y>=H-50)){z.state='walk';z.tc=rnd(5,7);shake=Math.max(shake,8);tone('sine',80,30,.3,.3)}
}
function bossDown(z){
  SFX.boom();setTimeout(()=>SFX.boom(),250);shake=18;nuke=.6;
  E.push({x:z.x,y:z.y,l:.9,max:.9,r1:320,col:'255,200,90'});
  blood(z.x,z.y,60,'#6a1212');splat(z.x,z.y,40,100,1);
  for(let i=0;i<3;i++)U.push({x:z.x+rnd(-60,60),y:z.y+rnd(-60,60),k:PK[Math.random()*PK.length|0],l:15,ph:0});
  msg={t:3,s:'THE WARDEN HAS FALLEN',c:'#ffd36a'};toSpawn=0;
  for(const q of Z.slice())if(q!==z&&!q.dead)kill(q);
}
function drawBoss(z){
  const r=z.r,t=z.ph;
  shadow(z.x,z.y,r*1.2,r*.95);
  g.save();g.translate(z.x,z.y);g.rotate(z.a);g.lineCap='round';
  const sw=Math.sin(t)*r*.18;

  g.fillRect(w*.81,h-2,5,drip);g.beginPath();g.arc(w*.83,h+drip,5,0,6.28);g.fill();
  g.fillStyle='#eaf5c8';g.font='900 25px "Courier New",monospace';g.textAlign='center';g.fillText(label,w/2,h/2+5);
  if(sub){g.font='11px "Courier New",monospace';g.fillStyle='#a9c98a';g.fillText(sub,w/2,h/2+25)}
  g.restore();
}
function overlay(a,b,c,buttons){
  g.fillStyle='rgba(0,0,0,.78)';g.fillRect(0,0,W,H);
  g.fillStyle='rgba(22,48,20,.35)';g.fillRect(70,65,W-140,H-130);
  g.strokeStyle='rgba(110,170,70,.5)';g.lineWidth=2;g.strokeRect(70,65,W-140,H-130);
  sideCredit();
  txt(a,W/2,H/2-95,52,'#e5c486','center');
  txt(b,W/2,H/2-50,20,'#f2ecd8','center');
  if(buttons)organicButton(W/2-145,H/2+15,290,72,c||'START','CLICK TO ENTER THE YARD');
  else txt(c,W/2,H/2+55,18,'#c9c2ab','center');
}
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(st=='play'&&!paused)update(dt);
  else if(st!='play'){for(const f of F){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92;f.l-=dt}F=F.filter(f=>f.l>0);nuke=Math.max(0,nuke-dt)}
  if(!P)reset();
  draw();
  if(st=='menu'){
    introT+=dt;
    if(introT<INTRO)cutscene(introT);
    else overlay('Last Light Yard','Survive every wave. Watch for spitters and bloaters.','START',true);
  }
  if(st=='over')overlay('You were overrun','Reached wave '+wave+' · '+kills+' zombies · score '+score,'TRY AGAIN',true);
  if(paused&&st=='play')overlay('Paused','','Press P to resume');
  requestAnimationFrame(frame);
}
function pos(e){const r=cv.getBoundingClientRect();m.x=(e.clientX-r.left)*W/r.width;m.y=(e.clientY-r.top)*H/r.height}
cv.addEventListener('pointermove',pos);
cv.addEventListener('pointerdown',e=>{initAudio();pos(e);cv.focus();if(st!='play'){if(st=='menu'&&introT<INTRO){introT=INTRO;return}reset();st='play'}m.down=true});
addEventListener('pointerup',()=>m.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;initAudio();
  if(k=='m'){muted=!muted;if(master)master.gain.value=muted?0:.5}
  if(st=='play'&&!paused){if((k=='1'||k=='2')&&P.w!=+k){P.w=+k;P.rel=0;tone('square',500,700,.05,.05)}if(k=='3')throwG()}
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k=='enter'&&st!='play'){if(st=='menu'&&introT<INTRO){introT=INTRO;return}reset();st='play'}
  if(k=='r'&&st=='play'&&P.rel<=0&&(P.w==2?P.sa<P.sm:P.ammo<P.mag)){P.rel=P.w==2?1.6:1.2;SFX.recharge()}
  if(k=='p'&&st=='play')paused=!paused;
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{m.down=false;for(const k in keys)keys[k]=false});
reset();requestAnimationFrame(frame);
})();
</script>
